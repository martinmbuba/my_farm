    <main>
        <div class="form-container">
        <h1>Subscribe to Our Newsletter</h1>
        <p>Stay updated with the latest news, Developments and offers from Mbuba Farm.</p>
        <form id="custom-Subscribe-form" autocomplete="on">
            <label>
            full name: <br>
            <input type="text" name="name" required><br>
            </label><br><br>

            <label>
            Email: <br>
            <input type="email" name="email" required><br>
            </label><br>

            <label>
            Interested In: <br>
            <select name="interest" required>
                <option value="Animal_rearing">Animal Rearing</option>
                <option value="Crop_farming">Crop Farming</option>
                <option value="Benchmarking">Benchmarking</option>
                <option value="workshops">Workshops</option>
                <option value="NewsLetter">Newsletter</option>
                <option value="Events">Events</option>
                <option value="Follow Up">Follow Up</option>
            </select><br>
            </label><br>

<button type="Submit"> Subscribe</button>

        </form>
         <p id="thank-you-message" style="display: none;color: green; font-weight: bold;"></p>
         
        </div>
        <div class="subscribers-list">
            <h2>Subscribers <span id="subscriber-count">0</span></h2>
            <ul id="subscriber-list"></ul>
          </div>
