<body style="background-color: #009973;">
  <header>
    <nav>
      <a href="index.html">HOME</a>
      <a href="services.html">SERVICES</a>
      <a href="contact.html">CONTACT</a>
      <a href="subscribe.html">SUBSCRIBE!!</a>
      <a href="events.html">EVENTS</a>
    </nav>
  </header>

  <main>
    <div class="form-container">
      <h1>Contact Us</h1>
      <p>Telephone: 0701274732 <button style="background-color: green;">CALL NOW</button></p>
      <p>Email: Mbubafarm2025@gmail.com <button style="background-color: green;">Send email</button></p>
      <form id="contact-form">
        <label>
          Name: <br>
          <input type="text" name="name" required autocomplete="name" />
        </label><br><br>

        <label>
          Email: <br>
          <input type="email" name="email" required autocomplete="email" />
        </label><br><br>

        <label>
          Message:<br>
          <textarea name="message" rows="5" required></textarea>
        </label><br><br>

        <button type="submit">Send</button>
      </form>

      <!-- Message preview area -->
      <div id="submitted-message" style="display: none; margin-top: 20px; border: 1px solid #ccc; padding: 15px; background-color: #f1f1f1;"></div>
    </div>
  </main>
